services:
  # Backend llama.cpp server - run this on each backend machine.
  #
  # Runs llama-server DIRECTLY — no Python proxy wrapper.
  # lb-proxy connects straight to llama-server on PORT (8000 or 8001).
  #
  # Dual-socket: start two containers per machine:
  #   SOCKET_ID=0 PORT=8000 make start-backend MODEL_ARGS="--model jc-builds/Qwen3.5-9B-Q4_K_M-GGUF"
  #   SOCKET_ID=1 PORT=8001 make start-backend MODEL_ARGS="--model jc-builds/Qwen3.5-9B-Q4_K_M-GGUF"

  llama-server:
    build: .
    image: llamacpp-backend:latest   # fixed name shared by all project variants
    container_name: llamacpp-backend-${SOCKET_ID:-0}
    privileged: true          # numactl + disabling numa_balancing
    network_mode: host        # Exposes port on host IP; lb-proxy discovers it
    pid: host                 # numactl sees real host NUMA topology
    ulimits:
      memlock:
        soft: -1              # Unlimited mlock — pins full model in RAM
        hard: -1
      stack: 67108864
    volumes:
      - llamacpp-models:/data/llamacpp/.llamacpp/models
      - llamacpp-bin:/data/llamacpp/.llamacpp/bin
      - llamacpp-config:/data/llamacpp/.llamacpp
      - /sys/devices/system/node:/sys/devices/system/node:ro
    environment:
      - LLAMACPP_HOME=/data/llamacpp/.llamacpp
      - LLAMACPP_AUTO_INSTALL=true
      - LLAMACPP_RELEASE_URL=https://github.com/ggml-org/llama.cpp/releases/download/b9371/llama-b9371-bin-ubuntu-x64.tar.gz
      - SOCKET_ID=${SOCKET_ID:-0}
      - PORT=${PORT:-8000}
      - SERVER_PORT=${SERVER_PORT:-8100}
      - MODEL_ARGS=${MODEL_ARGS:-}
    command:
      - bash
      - -c
      - >-
        echo 0 > /proc/sys/kernel/numa_balancing 2>/dev/null || true &&
        echo "[backend] socket=${SOCKET_ID:-0} port=${PORT:-8000}" &&
        exec llamacpp serve
        --host 0.0.0.0
        --port ${PORT:-8000}
        --server-port ${SERVER_PORT:-8100}
        --socket-id ${SOCKET_ID:-0}
        ${MODEL_ARGS}
    restart: unless-stopped

volumes:
  llamacpp-models:
    external: true        # shared across both sockets — create once with: docker volume create llamacpp-models
    name: llamacpp-models
  llamacpp-bin:
    external: true
    name: llamacpp-bin
  llamacpp-config:
    external: true
    name: llamacpp-config
